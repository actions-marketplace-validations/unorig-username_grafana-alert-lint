apiVersion: 1
groups:
  - orgId: 1
    name: checkout
    folder: Services
    interval: 1m
    rules:
      # Fires: a range query reduced with last.
      - uid: gal009-range-last
        title: Checkout open orders high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(checkout_open_orders)
              instant: false
              range: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: {params: [5000], type: gt}
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: ticket, team: checkout}
        annotations:
          summary: More than 5000 checkout orders are open
          runbook_url: https://runbooks.example.com/checkout/orders
      # Fires: instant false, classic condition on last.
      - uid: gal009-classic-last
        title: Checkout open orders high classic
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(checkout_open_orders)
              instant: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator: {params: [5000], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last}
                  type: query
              refId: B
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: ticket, team: checkout}
        annotations:
          summary: More than 5000 checkout orders are open
          runbook_url: https://runbooks.example.com/checkout/orders
      # Quiet: a range query reduced with mean needs the range.
      - uid: gal009-range-mean
        title: Checkout open orders high on average
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(checkout_open_orders)
              instant: false
              range: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: {params: [5000], type: gt}
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: ticket, team: checkout}
        annotations:
          summary: More than 5000 checkout orders are open on average
          runbook_url: https://runbooks.example.com/checkout/orders
      # Quiet: an instant query reduced with last.
      - uid: gal009-instant
        title: Checkout open orders high instant
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(checkout_open_orders)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: {params: [5000], type: gt}
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: ticket, team: checkout}
        annotations:
          summary: More than 5000 checkout orders are open
          runbook_url: https://runbooks.example.com/checkout/orders
