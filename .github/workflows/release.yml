name: release

# Push a tag like v0.1.1: builds the binaries the GitHub Action downloads,
# publishes the release with notes from CHANGELOG.md, then runs the action
# against that release on Linux, macOS and Windows. A tag with a suffix
# (v0.1.1-rc.1) makes a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/grafana-alert-lint_${os}_${arch}${ext}" ./cmd/grafana-alert-lint
          done
          (cd dist && sha256sum -- * > checksums.txt)

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          v=${v%%-*}
          # The "## X.Y.Z (date)" section, up to the next "## " heading.
          awk -v h="## $v " '/^## /{p = index($0, h) == 1; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $v"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre=--prerelease ;; esac
          # shellcheck disable=SC2086 # pre is empty or one flag
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre dist/*

  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        with:
          version: ${{ github.ref_name }}
          path: testdata/good
          args: --require-label severity

      - name: The downloaded binary is the release, not a source build
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bin="$RUNNER_TEMP/grafana-alert-lint/grafana-alert-lint"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          got=$("$bin" --version)
          echo "$got"
          [ "$got" = "grafana-alert-lint $TAG" ]
